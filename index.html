<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How do Australian councils promote community participation?</title>
  <meta name="description" content="A data story about the events Australian local councils run: where they happen, what they are, who comes, and how councils encourage people to take part.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <script defer src="js/embed.js"></script>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>How do councils get Australians to take part?</h1>
    <p class="hero-sub">A year of local council events across Australia</p>
  </div>
</header>

<main class="wrap">

  <section class="part">
    <header class="part-head">
      <div>
        <h2>Explore</h2>
      </div>
    </header>

    <div class="row">
      <figure class="fig span-5">
        <h3 class="fig-title">South Australia has the highest library program attendance rate</h3>
        <div class="chart" data-chart="1_states_symbol_map"></div>
      </figure>

      <figure class="fig span-7">
        <h3 class="fig-title">Remote Queensland councils have the highest attendance rates</h3>
        <div class="control" id="zoom-control"></div>
        <div class="chart" data-chart="2_council_choropleth"></div>
      </figure>

      <figure class="fig span-12">
        <h3 class="fig-title">Brisbane held council events on every day of 2025</h3>
        <div class="chart" data-chart="3_calendar_heatmap"></div>
      </figure>
    </div>
  </section>

  <section class="part">
    <header class="part-head">
      <div>
        <h2>Compare</h2>
      </div>
    </header>

    <div class="row">
      <figure class="fig span-7">
        <h4 class="fig-title">Seniors and young children each get about 1 in 5 Brisbane events</h4>
        <div class="chart" data-chart="4_audience_treemap"></div>
      </figure>

      <figure class="fig span-5">
        <h4 class="fig-title">Early childhood programs make up 48% to 75% of library attendance</h4>
        <div class="chart" data-chart="5_library_age_groups"></div>
      </figure>
    </div>

    <div class="row">
      <figure class="fig span-12">
        <h4 class="fig-title">The typical council draws about 290 attendances per 1,000 residents</h4>
        <div class="chart" data-chart="6_council_beeswarm"></div>
      </figure>

      <figure class="fig span-7">
        <h4 class="fig-title">Outreach sessions draw the biggest crowds in Townsville</h4>
        <div class="chart" data-chart="15_session_kind_lollipop"></div>
      </figure>

      <figure class="fig span-5">
        <h4 class="fig-title">Nearly half of Townsville sessions had fewer than 10 people</h4>
        <div class="chart" data-chart="7_session_size_histogram"></div>
      </figure>
    </div>

    <div class="row">
      <figure class="fig span-7">
        <h4 class="fig-title">Sport and fitness events rise and fall</h4>
        <div class="chart" data-chart="8_monthly_streamgraph"></div>
      </figure>

      <figure class="fig span-5">
        <h4 class="fig-title">Townsville attendance peaks in July and August</h4>
        <div class="chart" data-chart="9_attendance_year_wheel"></div>
      </figure>

      <figure class="fig span-12">
        <h4 class="fig-title">Brisbane events cluster on weekday mornings</h4>
        <div class="chart" data-chart="10_weekday_hour_heatmap"></div>
      </figure>
    </div>
  </section>

  <section class="part">
    <header class="part-head">
      <div>
        <h2>Investigate</h2>
      </div>
    </header>

    <div class="row">
      <figure class="fig span-6">
        <h3 class="fig-title">Nearly 8 in 10 Brisbane events are free</h3>
        <div class="chart" data-chart="11_free_waffle"></div>
      </figure>

      <figure class="fig span-6">
        <h3 class="fig-title">Libraries and parks host 7 in 10 Brisbane events</h3>
        <div class="control" id="audience-control"></div>
        <div class="chart" data-chart="12_venue_dot_map"></div>
      </figure>

      <figure class="fig span-6">
        <h3 class="fig-title">Park sessions are 2% of Townsville programs but draw 17% of people</h3>
        <div class="chart" data-chart="13_outreach_slope"></div>
      </figure>

      <figure class="fig span-6">
        <h3 class="fig-title">Satisfaction with consultation rose in Melbourne but fell in country Victoria</h3>
        <div class="chart" data-chart="14_consultation_dumbbell"></div>
      </figure>
    </div>
  </section>
</main>

</body>
</html>
